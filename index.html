    <style>

        }

            position: fixed;

            main h1 { font-size: clamp(3.25rem, 12.5vw, 5.5rem) !important; line-height: .91; overflow-wrap: normal; }
            main .max-w-3xl { max-width: 100%; }

        @media(max-width: 375px) { main { padding-top: 168px !important; } main h1 { font-size: 12vw !important; } }
        @media(min-width:768px) and (max-width:1023px) { main { padding-top: 170px; } main h1 { font-size: clamp(5.5rem, 10vw, 8rem) !important; } }

<body class="antialiased min-h-screen flex flex-col justify-between">

    <div id="canvas-container"></div>

    <main class="flex-grow flex flex-col justify-center px-8 relative z-10 pointer-events-none mt-0">
        <!-- Left Side Text Block -->
        <div class="max-w-3xl pointer-events-auto relative">
            <!-- Floating small text list -->
            <div class="absolute -top-32 left-0 text-[10px] tracking-widest font-mono text-gray-200 leading-relaxed mb-12 text-shadow">
                <p class="text-white/70 mb-1">[ ERROR 404 ]</p>
                <p>WRONG TURN</p>
                <p>RIGHT STUDIO</p>
                <p>KEEP EXPLORING</p>
                <div class="w-6 h-px bg-white/50 mt-2"></div>
            </div>

            <h1 class="text-7xl md:text-8xl lg:text-[130px] font-bold leading-[0.85] tracking-tighter mb-8 text-shadow">
                404<span class="error-dot">.</span><br><span class="error-subhead">Lost in the<br>system.</span>
            </h1>
            
            <p class="text-lg md:text-xl font-medium max-w-sm mb-10 text-gray-100 leading-snug text-shadow">
                This page wandered off the grid. The good stuff is still one click away.
            </p>
        </div>

        <!-- Right Side Floating Text -->
        <div class="hidden lg:block absolute right-8 top-1/2 -translate-y-1/2 text-[10px] tracking-widest font-mono text-gray-200 leading-relaxed text-right border-r border-white/50 pr-4 text-shadow pointer-events-auto">
            <p>PAGE NOT FOUND</p>
            <p>IDEAS STILL HERE</p>
            <p>BACK TO THE START</p>
            <div class="w-6 h-px bg-white/50 mt-2 ml-auto"></div>
        </div>
    </main>

    <script>
        // Setup Three.js scene
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // Deep red backdrop prevents black seams between the densely packed bubbles.
        scene.background = new THREE.Color(0xa92117);
        
        // Add subtle fog to blend objects in distance
        scene.fog = new THREE.FogExp2(0xa92117, 0.012);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 18;
        // Angle camera slightly down as seen in reference
        camera.position.y = 3;
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, window.innerWidth < 700 ? 1.5 : 2)); // optimize for high dpi
        
        // Soft shadows
        renderer.shadowMap.enabled = window.innerWidth >= 768;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);
        
        const fillLight = new THREE.DirectionalLight(0xffa0a0, 0.3);
        fillLight.position.set(-10, 0, -10);
        scene.add(fillLight);

        // Risograph-inspired ink: irregular halftone dots, paper grain, ink dropout,
        // and slight misregistration. Generated once and reused across the field.
        function makeRisoTexture(base, ink, seed) {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d');
            let state = seed;
            const random = () => {
                state = (Math.imul(state, 1664525) + 1013904223) | 0;
                return (state >>> 0) / 4294967296;
            };
            ctx.fillStyle = base;
            ctx.fillRect(0, 0, size, size);
            // Tiny scattered fibers and pigment dropout create the uncoated-paper feel.
            for (let i = 0; i < 39000; i++) {
                const x = random() * size, y = random() * size;
                const light = random() > .47;
                ctx.fillStyle = light ? 'rgba(255,244,224,.18)' : 'rgba(64,12,8,.16)';
                const d = .4 + random() * 1.9;
                ctx.fillRect(x, y, d, d * (.5 + random()));
            }
            // Loose rotated halftone screen with variable ink coverage.
            ctx.save();
            ctx.translate(size / 2, size / 2);
            ctx.rotate(-Math.PI / 11);
            const step = 13;
            for (let y = -380; y < 380; y += step) {
                for (let x = -380; x < 380; x += step) {
                    const variance = random();
                    if (variance < .12) continue;
                    const r = .75 + variance * 2.2;
                    ctx.beginPath();
                    ctx.ellipse(x + (random()-.5)*2.1, y + (random()-.5)*2.1,
                        r, r * (.8 + random()*.4), random()*.5, 0, Math.PI*2);
                    ctx.fillStyle = ink;
                    ctx.fill();
                }
            }
            ctx.restore();
            // Occasional visible ink clusters, without overpowering facial features.
            for (let i = 0; i < 1050; i++) {
                ctx.beginPath();
                ctx.arc(random()*size, random()*size, .3+random()*1.25, 0, Math.PI*2);
                ctx.fillStyle = random()>.5 ? 'rgba(255,245,227,.19)' : 'rgba(66,10,8,.18)';
                ctx.fill();
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            texture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
            texture.colorSpace = THREE.SRGBColorSpace || undefined;
            return texture;
        }
        const redRisoMap = makeRisoTexture('#ff402b', 'rgba(135,18,12,.24)', 917);
        const whiteRisoMap = makeRisoTexture('#f4eee6', 'rgba(115,91,81,.19)', 251);

        // Create base materials
        const redColor = 0xff331f; // Orange-red color matching image
        const whiteColor = 0xf5f5f5;

        // Custom shader material for soft matte look with subtle rim lighting
        const customMaterialSettings = {
            roughness: 0.7,
            metalness: 0.1,
            clearcoat: 0.1,
            clearcoatRoughness: 0.8,
        };

        const redMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            map: redRisoMap,
            ...customMaterialSettings
        });

        const whiteMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            map: whiteRisoMap,
            ...customMaterialSettings
        });

        const blackMaterial = new THREE.MeshBasicMaterial({ color: 0x111111 });

        // Dense, soft fiber shading plus actual tapered fur strands for a fuzzy silhouette.
        const sphereGeometry = new THREE.SphereGeometry(1.5, window.innerWidth < 768 ? 32 : 64, window.innerWidth < 768 ? 24 : 48);
        const furrySurface = (material) => {
            material.roughness = 1;
            material.metalness = 0;
            material.clearcoat = 0;
            material.onBeforeCompile = shader => {
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <common>',
                    `#include <common>
float furHash(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}`
                ).replace(
                    '#include <color_fragment>',
                    `#include <color_fragment>
float fiber = furHash(floor(vViewPosition * 155.0));
diffuseColor.rgb *= 0.89 + fiber * 0.19;`
                );
            };
            material.needsUpdate = true;
        };
        furrySurface(redMaterial);
        furrySurface(whiteMaterial);
        // Individual tapered hairs are instanced (two draw calls), not one mesh per hair.
        const isSmallScreen = window.innerWidth < 768;
        const hairsPerRed = isSmallScreen ? 24 : 65;
        const hairsOnWhite = isSmallScreen ? 400 : 760;
        const hairLength = isSmallScreen ? 0.19 : 0.23;
        const hairGeometry = new THREE.ConeGeometry(0.013, 1, 3, 1);
        hairGeometry.translate(0, 0.5, 0); // root at origin
        const redHairMaterial = new THREE.MeshLambertMaterial({ color: 0xe8402c, side: THREE.DoubleSide, transparent: true, opacity: .92 });
        const whiteHairMaterial = new THREE.MeshLambertMaterial({ color: 0xeee5dc, side: THREE.DoubleSide, transparent: true, opacity: .93 });
        const redHair = new THREE.InstancedMesh(hairGeometry, redHairMaterial, 16 * 22 * hairsPerRed);
        const whiteHair = new THREE.InstancedMesh(hairGeometry, whiteHairMaterial, hairsOnWhite);
        redHair.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        whiteHair.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        redHair.frustumCulled = false;
        whiteHair.frustumCulled = false;
        scene.add(redHair, whiteHair);
        const hairRoots = [];
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));
        const hairMatrix = new THREE.Matrix4();
        const hairPosition = new THREE.Vector3();
        const hairDirection = new THREE.Vector3();
        const hairQuaternion = new THREE.Quaternion();
        const hairScale = new THREE.Vector3();
        const upVector = new THREE.Vector3(0, 1, 0);
        function hairSeed(index, count, phase) {
            const v = (index + .5) / count;
            const y = 1 - 2 * v;
            const radius = Math.sqrt(Math.max(0, 1 - y*y));
            const theta = goldenAngle * index + phase;
            return new THREE.Vector3(Math.cos(theta)*radius, y, Math.sin(theta)*radius);
        }
        function updateFur() {
            bubbleField.updateMatrixWorld(true);
            camera.updateMatrixWorld(true);
            let redIndex = 0;
            for (let b = 0; b < spheres.length; b++) {
                const data = spheres[b];
                const featured = data.isWhite;
                const count = featured ? hairsOnWhite : hairsPerRed;
                const fieldMatrix = featured && mobileFeatured ? camera.matrixWorld : bubbleField.matrixWorld;
                const worldMatrix = new THREE.Matrix4().multiplyMatrices(fieldMatrix, data.mesh.matrix);
                for (let i = 0; i < count; i++) {
                    const normal = hairSeed(i, count, b * 2.39);
                    // Keep facial features legible: no hair directly over the eyes or mouth.
                    if (normal.z > 0.87 && Math.abs(normal.x) < .65 && normal.y > -.37 && normal.y < .35) {
                        normal.z *= .96;
                    }
                    hairPosition.copy(normal).multiplyScalar(1.48).applyMatrix4(worldMatrix);
                    hairDirection.copy(normal).transformDirection(worldMatrix);
                    hairDirection.x += Math.sin(i * 17.3 + b) * .12;
                    hairDirection.y += Math.cos(i * 11.7 + b) * .10;
                    hairDirection.normalize();
                    hairQuaternion.setFromUnitVectors(upVector, hairDirection);
                    const worldScale = data.mesh.scale.x;
                    hairScale.setScalar(1);
                    hairScale.set((i % 4 === 0 ? .025 : .018) * worldScale, hairLength * (.65 + (i % 7)/10) * worldScale, (i % 4 === 0 ? .025 : .018) * worldScale);
                    hairMatrix.compose(hairPosition, hairQuaternion, hairScale);
                    if (featured) whiteHair.setMatrixAt(i, hairMatrix);
                    else redHair.setMatrixAt(redIndex++, hairMatrix);
                }
            }
            redHair.count = redIndex;
            redHair.instanceMatrix.needsUpdate = true;
            whiteHair.instanceMatrix.needsUpdate = true;
        }
        
        // Helper function to create face features (eyes and mouth)
        function addFaceFeatures(sphereMesh, isWhite = false) {
            // Eyes
            const eyeGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.1, 16);
            eyeGeo.rotateX(Math.PI / 2);
            
            const leftEye = new THREE.Mesh(eyeGeo, isWhite ? blackMaterial : new THREE.MeshBasicMaterial({color: 0xffffff}));
            leftEye.position.set(-0.5, 0.2, 1.45);
            // Slight rotation to follow sphere curve
            leftEye.lookAt(-0.5, 0.2, 2);
            
            const rightEye = new THREE.Mesh(eyeGeo, isWhite ? blackMaterial : new THREE.MeshBasicMaterial({color: 0xffffff}));
            rightEye.position.set(0.5, 0.2, 1.45);
            rightEye.lookAt(0.5, 0.2, 2);

            // Mouth (straight line)
            const mouthGeo = new THREE.BoxGeometry(0.8, 0.08, 0.1);
            const mouth = new THREE.Mesh(mouthGeo, isWhite ? blackMaterial : new THREE.MeshBasicMaterial({color: 0xffffff}));
            mouth.position.set(0, -0.3, 1.48);
            // Bend mouth slightly to match sphere curve (using a simple box for performance, but curved would be better)
            // For a perfect replica, we'd use a curved tube geometry here
            
            // Group them
            const faceGroup = new THREE.Group();
            faceGroup.add(leftEye);
            faceGroup.add(rightEye);
            faceGroup.add(mouth);
            
            sphereMesh.add(faceGroup);
            return faceGroup;
        }

        const spheres = [];
        // Rotate the entire packed bubble field into an isometric, three-quarter view.
        const bubbleField = new THREE.Group();
        bubbleField.rotation.set(-0.32, -0.38, -0.08);
        scene.add(bubbleField);
        let whiteSphereMesh = null;
        const spacing = 3.2; // distance between sphere centers
        
        // Create a grid of spheres
        const rows = 16;
        const cols = 22;
        
        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                
                // Calculate position based on grid
                // Offset every other row for hexagonal packing look
                const rowOffset = (i % 2 === 0) ? 0 : spacing / 2;
                const x = (j - (cols - 1)/2) * spacing + rowOffset;
                const y = - (i - (rows - 1)/2) * (spacing * 0.82); // closer y spacing for hex pack
                const z = -0.12 * Math.abs(x) - 0.035 * Math.abs(y); // slight curve backward
                
                // Determine if this should be the white sphere
                // Pick a spot roughly in the middle-right
                const isTargetWhite = (i === 7 && j === 12);
                
                const mesh = new THREE.Mesh(
                    sphereGeometry, 
                    isTargetWhite ? whiteMaterial : redMaterial
                );
                
                mesh.position.set(x, y, z);
                mesh.castShadow = window.innerWidth >= 768;
                mesh.receiveShadow = window.innerWidth >= 768;
                
                // Randomize slight rotation for variety
                mesh.rotation.y = (Math.random() - 0.5) * 0.2;
                mesh.rotation.x = (Math.random() - 0.5) * 0.1;
                
                // Add face
                const face = addFaceFeatures(mesh, isTargetWhite);
                
                bubbleField.add(mesh);
                
                // Store data for animation
                const sphereData = {
                    mesh: mesh,
                    face: face,
                    basePosition: {x, y, z},
                    baseRotation: {x: mesh.rotation.x, y: mesh.rotation.y},
                    isWhite: isTargetWhite
                };
                
                spheres.push(sphereData);
                
                if (isTargetWhite) {
                    whiteSphereMesh = sphereData;
                    // Ensure white sphere is slightly forward and larger for emphasis
                    mesh.position.z += 1;
                    mesh.scale.set(1.1, 1.1, 1.1);
                }
            }
        }

        // Keep the featured white bubble visible on every viewport. On narrow
        // screens it lives in camera space, so the isometric field cannot push
        // it outside the portrait crop or hide it behind foreground red bubbles.
        const whiteBubbleHome = whiteSphereMesh.mesh.position.clone();
        let mobileFeatured = false;
        function positionFeaturedBubble() {
            if (!whiteSphereMesh) return;
            const mobile = window.innerWidth < 768;
            const featured = whiteSphereMesh.mesh;
            if (mobile !== mobileFeatured) {
                if (mobile) {
                    bubbleField.remove(featured);
                    camera.add(featured);
                    if (!camera.parent) scene.add(camera);
                } else {
                    camera.remove(featured);
                    bubbleField.add(featured);
                    featured.position.copy(whiteBubbleHome);
                }
                mobileFeatured = mobile;
            }
            if (mobile) {
                // Upper-right quadrant, clear of the left-aligned headline.
                // Negative camera Z is in front of the camera; no clipping.
                const aspect = window.innerWidth / window.innerHeight;
                const depth = 9;
                const visibleHalfHeight = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * depth;
                const visibleHalfWidth = visibleHalfHeight * aspect;
                const xNdc = window.innerWidth <= 375 ? 0.40 : 0.43;
                featured.position.set(xNdc * visibleHalfWidth, 0.37 * visibleHalfHeight, -depth);
                // Fits narrow iPhone 8 while remaining prominent on larger phones.
                const desiredRadius = Math.min(visibleHalfWidth * 0.43, visibleHalfHeight * 0.20);
                featured.scale.setScalar(desiredRadius / 1.5);
                featured.rotation.set(0, 0, 0);
                featured.renderOrder = 10;
            } else {
                featured.renderOrder = 0;
                featured.scale.setScalar(1.1);
            }
        }
        positionFeaturedBubble();
        updateFur();

        // Mouse tracking
        const mouse = new THREE.Vector2();
        const targetMouse = new THREE.Vector2();
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;

        document.addEventListener('touchmove', (event) => {
            if (!event.touches.length) return;
            mouse.x = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
        }, { passive: true });

        document.addEventListener('mousemove', (event) => {
            // Normalized device coordinates (-1 to +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            positionFeaturedBubble();
            updateFur();
        });

        const clock = new THREE.Clock();
        let furFrame = 0;

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();

            // Smooth mouse follow (lerp)
            targetMouse.x += (mouse.x - targetMouse.x) * 0.05;
            targetMouse.y += (mouse.y - targetMouse.y) * 0.05;

            // Animate all spheres
            spheres.forEach(data => {
                const { mesh, basePosition, isWhite } = data;
                
                // Idle floating animation
                const floatY = Math.sin(time * 1.5 + basePosition.x) * 0.1;
                if (!isWhite || !mobileFeatured) mesh.position.y = basePosition.y + floatY;
                
                if (isWhite) {
                    // White sphere follows cursor exactly by rotating
                    
                    // Convert mouse to world position roughly at depth of sphere
                    const vector = new THREE.Vector3(targetMouse.x, targetMouse.y, 0.5);
                    vector.unproject(camera);
                    const dir = vector.sub(camera.position).normalize();
                    const distance = -camera.position.z / dir.z;
                    const pos = camera.position.clone().add(dir.multiplyScalar(distance));
                    
                    // Look at cursor position
                    // We only want slight rotation, not full looking
                    const lookFactorX = targetMouse.x * 0.8;
                    const lookFactorY = targetMouse.y * 0.8;
                    
                    // Apply rotation directly
                    if (mobileFeatured) {
                        mesh.rotation.y = lookFactorX * 0.25;
                        mesh.rotation.x = -lookFactorY * 0.25;
                    } else {
                        mesh.rotation.y = lookFactorX;
                        mesh.rotation.x = -lookFactorY;
                    }
                    
                } else {
                    // Red spheres subtly follow white sphere or just bob
                    // Calculate distance to white sphere
                    if (whiteSphereMesh) {
                        const dx = mesh.position.x - whiteSphereMesh.mesh.position.x;
                        const dy = mesh.position.y - whiteSphereMesh.mesh.position.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        
                        // Spheres closer to center move slightly more
                        const influence = Math.max(0, 1 - dist/15);
                        
                        mesh.rotation.y = data.baseRotation.y + (targetMouse.x * 0.2 * influence);
                        mesh.rotation.x = data.baseRotation.x - (targetMouse.y * 0.2 * influence);
                    }
                }
            });

            // Very subtle camera movement based on mouse
            camera.position.x += (targetMouse.x * 0.5 - camera.position.x) * 0.02;
            camera.position.y += (-targetMouse.y * 0.35 + 3 - camera.position.y) * 0.02;
            camera.lookAt(0, 0, 0);
            // Maintain the diagonal/isometric view while adding restrained parallax.
            bubbleField.rotation.y += (-0.38 + targetMouse.x * 0.035 - bubbleField.rotation.y) * 0.025;
            bubbleField.rotation.x += (-0.32 - targetMouse.y * 0.025 - bubbleField.rotation.x) * 0.025;

            // Update fur every other frame on mobile to preserve responsive interaction.
            if (++furFrame % (isSmallScreen ? 2 : 1) === 0) updateFur();
            renderer.render(scene, camera);
        }

        // Start animation loop
        animate();
        
        // Add a nice entrance animation for the UI elements
        window.addEventListener('load', () => {
            
            gsap.from("h1", {
                y: 50,
                opacity: 0,
                duration: 1,
                delay: 0.3,
                ease: "power3.out"
            });
            
            gsap.from("main p", {
                y: 20,
                opacity: 0,
                duration: 1,
                delay: 0.5,
                ease: "power3.out"
            });
            
            gsap.from(".absolute.left-0", {
                x: -30,
                opacity: 0,
                duration: 1,
                delay: 0.8,
                ease: "power3.out"
            });
            
            gsap.from(".absolute.right-8", {
                x: 30,
                opacity: 0,
                duration: 1,
                delay: 0.8,
                ease: "power3.out"
            });
            
            // animate spheres in
            spheres.filter(data => !data.isWhite).forEach((data, index) => {
                gsap.from(data.mesh.scale, {
                    x: 0, y: 0, z: 0,
                    duration: 1.5,
                    delay: 0.5 + (Math.random() * 0.5),
                    ease: "elastic.out(1, 0.5)"
                });
            });
        });

    </script>
</body>
</html>
